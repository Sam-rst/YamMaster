name: CI/CD

on:
  push:
    branches: [main, develop, recette, 'feature/**', 'bugfix/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, recette]

jobs:

  # ============================================================
  # GATE — Vérifie le nommage de la branche
  # ============================================================
  branch-naming:
    name: Vérification nommage branche
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la convention de nommage
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "Branche: $BRANCH"
          if [[ "$BRANCH" =~ ^(main|develop|recette|feature/.*|bugfix/.*|hotfix/.*)$ ]]; then
            echo "✅ Convention respectée: $BRANCH"
          else
            echo "❌ Branche mal nommée: $BRANCH"
            echo "Conventions acceptées: main, develop, recette, feature/*, bugfix/*, hotfix/*"
            exit 1
          fi

  # ============================================================
  # LINT — Backend + Frontend
  # ============================================================
  backend-lint:
    name: Backend Lint + Typecheck
    runs-on: ubuntu-latest
    needs: branch-naming
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: branch-naming
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  # ============================================================
  # TESTS — Backend + Frontend
  # ============================================================
  backend-tests:
    name: Backend Tests (coverage ≥ 90%)
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx jest --coverage --coverageThreshold='{"global":{"statements":90,"branches":80,"functions":90,"lines":90}}'

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run test:coverage

  # ============================================================
  # BUILD — Backend + Frontend
  # ============================================================
  backend-build:
    name: Backend Build (TypeScript)
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  frontend-build:
    name: Frontend Build (Web)
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  # ============================================================
  # DEPLOY — Uniquement sur main, develop, recette
  # ============================================================
  deploy-dev:
    name: Déploiement Dev
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: echo "🚀 Déploiement en environnement DEV"
      # TODO: Ajouter les commandes de déploiement dev

  deploy-recette:
    name: Déploiement Recette
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/recette' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: echo "🧪 Déploiement en environnement RECETTE"
      # TODO: Ajouter les commandes de déploiement recette

  deploy-prod:
    name: Déploiement Production
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: echo "🏁 Déploiement en PRODUCTION"
      # TODO: Ajouter les commandes de déploiement production
