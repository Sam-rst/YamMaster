name: CI/CD Preview

on:
  push:
    branches: [preview]

jobs:
  ci:
    name: Lint → Tests → Build
    uses: ./.github/workflows/_ci-shared.yml
    secrets: inherit

  deploy-backend:
    name: Déploiement Backend Preview
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🧪 Déploiement backend en environnement PREVIEW"
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_PREVIEW }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK_PREVIEW }}"
            echo "Deploy hook triggered"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_PREVIEW non configuré"
            exit 1
          fi

  deploy-frontend:
    name: Déploiement Frontend Preview
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Frontend
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
