name: CI/CD Production

on:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint → Tests → Build
    uses: ./.github/workflows/_ci-shared.yml
    secrets: inherit

  deploy-backend:
    name: Déploiement Backend Production
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🏁 Déploiement backend en PRODUCTION"
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deploy hook triggered"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK non configuré"
            exit 1
          fi

  deploy-frontend:
    name: Déploiement Frontend Production
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Export Vercel env vars
        run: |
          grep -v '^#' .vercel/.env.production.local | grep '=' >> $GITHUB_ENV

      - name: Build Frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
