name: CI/CD Production

on:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint → Tests → Build
    uses: ./.github/workflows/_ci-shared.yml
    secrets: inherit

  deploy-prod:
    name: Déploiement Production
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🏁 Déploiement en PRODUCTION"
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
            echo "Deploy hook triggered"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_PROD non configuré — Render auto-deploy actif"
          fi
