name: EAS Update (OTA)

on:
  push:
    branches: [develop, recette, main]
    paths:
      - 'frontend/**'
      - 'shared/**'

jobs:
  eas-update:
    name: Expo OTA Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=production" >> $GITHUB_OUTPUT
            echo "message=Production release" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "recette" ]; then
            echo "channel=preview" >> $GITHUB_OUTPUT
            echo "message=Recette release" >> $GITHUB_OUTPUT
          else
            echo "channel=development" >> $GITHUB_OUTPUT
            echo "message=Dev update" >> $GITHUB_OUTPUT
          fi

      - name: Publish EAS Update
        working-directory: frontend
        run: |
          eas update \
            --branch ${{ steps.channel.outputs.channel }} \
            --message "${{ steps.channel.outputs.message }} — ${{ github.event.head_commit.message }}" \
            --non-interactive
