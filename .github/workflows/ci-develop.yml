name: CI/CD Develop

on:
  push:
    branches: [develop]

jobs:
  ci:
    name: Lint → Tests → Build
    uses: ./.github/workflows/_ci-shared.yml

  deploy-dev:
    name: Déploiement Dev
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🚀 Déploiement en environnement DEV"
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"
            echo "Deploy hook triggered"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_DEV non configuré — Render auto-deploy actif"
          fi
