name: CI/CD Recette

on:
  push:
    branches: [recette]

jobs:
  ci:
    name: Lint → Tests → Build
    uses: ./.github/workflows/_ci-shared.yml

  deploy-recette:
    name: Déploiement Recette
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🧪 Déploiement en environnement RECETTE"
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_RECETTE }}" ]; then
            curl -s "${{ secrets.RENDER_DEPLOY_HOOK_RECETTE }}"
            echo "Deploy hook triggered"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_RECETTE non configuré — Render auto-deploy actif"
          fi
