# render.yaml — Infrastructure as Code pour Render
# Docs: https://docs.render.com/blueprint-spec
# Note: le frontend est déployé sur Vercel (voir frontend/vercel.json)

services:
  # Backend — WebSocket Server
  - type: web
    name: yammaster-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps --include=dev && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 3000
      - key: DEV_MODE
        value: false
      - key: NODE_ENV
        value: production
