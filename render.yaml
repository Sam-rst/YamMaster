# render.yaml — Infrastructure as Code pour Render
# Docs: https://docs.render.com/blueprint-spec

services:
  # Backend — WebSocket Server
  - type: web
    name: yammaster-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 3000
      - key: DEV_MODE
        value: false
      - key: NODE_ENV
        value: production

  # Frontend — Static Site (Expo Web)
  - type: web
    name: yammaster-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
