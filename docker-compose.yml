services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yammaster
      POSTGRES_PASSWORD: yammaster
      POSTGRES_DB: yammaster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

